<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微纳工艺助手</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sky:#0ea5e9;--sky-d:#0284c7;--sky-l:#e0f2fe;
  --green:#22c55e;--green-l:#dcfce7;
  --orange:#f97316;--red:#ef4444;
  --bg:#f0f9ff;--card:#fff;
  --text:#0f172a;--muted:#64748b;--border:#e2e8f0;
  --r:12px;--sh:0 1px 3px rgba(0,0,0,.1);
}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding-bottom:88px}

/* HEADER */
.hdr{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);padding:11px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--sh)}
.hdr-l{display:flex;align-items:center;gap:9px}
.back{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:var(--muted)}
.back.on{display:flex}
.htitle{font-size:15px;font-weight:700;color:var(--sky-d)}
.hsub{font-size:11px;color:var(--muted);margin-top:1px}
.hdr-r{display:flex;gap:7px;align-items:center}
.lbtn{padding:4px 13px;border-radius:20px;border:1.5px solid var(--sky);background:#fff;color:var(--sky);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.lbtn:hover{background:var(--sky);color:#fff}
.ibtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:all .2s}
.ibtn:hover{background:var(--sky-l)}
.ibtn.on{background:var(--sky);border-color:var(--sky);color:#fff}

/* EDIT BANNER */
.ebanner{background:linear-gradient(135deg,#f97316,#f59e0b);color:#fff;padding:9px 14px;display:none;align-items:center;justify-content:space-between;font-size:13px;font-weight:600}
.ebanner.on{display:flex}
.ebanner-btn{background:rgba(255,255,255,.25);border:none;color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer}

/* HOME */
.sec-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:16px 14px 8px}
.pcard{background:#fff;border-radius:var(--r);margin:0 12px 10px;padding:15px;box-shadow:var(--sh);cursor:pointer;border:1.5px solid transparent;transition:all .2s;display:flex;align-items:center;gap:11px}
.pcard:hover{border-color:var(--sky);box-shadow:0 4px 14px rgba(14,165,233,.18)}
.picon{width:46px;height:46px;border-radius:11px;background:var(--sky-l);color:var(--sky-d);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.pinfo{flex:1;min-width:0}
.pname{font-size:15px;font-weight:600;margin-bottom:3px}
.pdesc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{display:flex;align-items:center;gap:8px;margin-top:6px}
.pbadge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--sky-l);color:var(--sky-d);font-weight:500}
.pbar{flex:1;height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.pbar-f{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.pbar-t{font-size:11px;color:var(--muted);white-space:nowrap}
.parrow{color:var(--muted);font-size:18px}
.add-pcard{margin:0 12px 10px;padding:13px;border:2px dashed var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px;cursor:pointer;transition:all .2s;background:transparent;width:calc(100% - 24px)}
.add-pcard:hover{border-color:var(--sky);color:var(--sky)}

/* PROCESS VIEW */
.pgbar{background:#fff;padding:13px 15px;border-bottom:1px solid var(--border)}
.pgbar-top{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}
.pgbar-lbl{font-weight:500}
.pgbar-pct{font-weight:700;color:var(--sky-d)}
.pgbar-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.pgbar-fill{height:100%;background:linear-gradient(90deg,var(--sky),var(--green));border-radius:4px;transition:width .3s}
.pgbar-time{font-size:11px;color:var(--muted);margin-top:5px;text-align:right}

/* PHASE */
.phase{margin:10px 12px 0}
.ph-hdr{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:var(--r) var(--r) 0 0;cursor:pointer;user-select:none}
.ph-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5);flex-shrink:0}
.ph-name{font-size:13px;font-weight:700;flex:1;color:#fff}
.ph-cnt{font-size:12px;color:rgba(255,255,255,.75)}
.ph-edit-btn{background:rgba(255,255,255,.22);border:none;color:#fff;padding:3px 8px;border-radius:6px;font-size:11px;cursor:pointer}
.ph-chev{font-size:13px;color:rgba(255,255,255,.8);transition:transform .2s}
.ph-chev.open{transform:rotate(180deg)}
.ph-body{background:#fff;border-radius:0 0 var(--r) var(--r);overflow:hidden}
.ph-body.closed{display:none}

/* STEP */
.step{padding:12px 13px;border-bottom:1px solid var(--border);transition:background .15s}
.step:last-child{border-bottom:none}
.step.done{background:#f0fdf4}
.step-main{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.chk{flex-shrink:0;width:26px;height:26px;border-radius:7px;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:1px;transition:all .15s}
.step.done .chk{background:var(--green);border-color:var(--green);color:#fff}
.sinfo{flex:1;min-width:0}
.shdr{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.sname{font-size:14px;font-weight:500;line-height:1.4}
.step.done .sname{color:var(--muted);text-decoration:line-through}
.stime{flex-shrink:0;font-size:11px;padding:2px 7px;border-radius:12px;background:var(--sky-l);color:var(--sky-d);font-weight:500;margin-top:1px}
.seq{font-size:11px;color:var(--muted);margin-top:3px}
.ntoggle{font-size:11px;color:var(--sky);margin-top:5px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;background:none;border:none;padding:0}
.nbody{margin-top:8px;padding:10px;background:var(--bg);border-radius:8px;display:none}
.nbody.on{display:block}
.ni{font-size:12px;color:#334155;line-height:1.65;padding:2px 0 2px 13px;position:relative}
.ni::before{content:'·';position:absolute;left:0;color:var(--sky)}
.ni.w{color:#92400e;background:#fef3c7;border-radius:4px;padding:4px 8px 4px 22px;margin:3px 0}
.ni.w::before{content:'⚠';left:5px;color:var(--orange)}
.sactions{display:none;gap:6px;margin-top:8px}
.step.em .sactions{display:flex}
.se-btn{font-size:12px;padding:4px 10px;border-radius:6px;border:none;cursor:pointer;background:var(--sky-l);color:var(--sky-d)}
.sd-btn{font-size:12px;padding:4px 10px;border-radius:6px;border:none;cursor:pointer;background:#fee2e2;color:#b91c1c}
.add-step-row{padding:8px 13px;display:none}
.add-step-row.on{display:block}
.add-step-btn{width:100%;padding:8px;border-radius:8px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;transition:all .2s}
.add-step-btn:hover{border-color:var(--sky);color:var(--sky)}
.add-phase-btn{margin:10px 12px;padding:12px;border:2px dashed var(--border);border-radius:var(--r);display:none;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;cursor:pointer;transition:all .2s;background:transparent;width:calc(100% - 24px)}
.add-phase-btn.on{display:flex}
.add-phase-btn:hover{border-color:var(--sky);color:var(--sky)}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:18px}
.mhandle{width:34px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.mtitle{font-size:16px;font-weight:700;margin-bottom:14px}
.fg{margin-bottom:13px}
.flabel{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px;display:block}
.fi,.fta{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text);background:#fff;transition:border-color .2s}
.fi:focus,.fta:focus{outline:none;border-color:var(--sky)}
.fta{resize:vertical;min-height:90px;line-height:1.6}
.fhint{font-size:11px;color:var(--muted);margin-top:3px}
.mact{display:flex;gap:10px;margin-top:14px}
.msave,.mcancel{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.msave{background:var(--sky);color:#fff}
.msave:hover{background:var(--sky-d)}
.mcancel{background:var(--bg);color:var(--muted)}
.mcancel:hover{background:var(--border)}

/* FAB */
.fab-wrap{position:fixed;bottom:20px;right:20px;z-index:40;display:none;flex-direction:column;gap:9px;align-items:flex-end}
.fab-wrap.on{display:flex}
.fab{padding:11px 18px;border-radius:50px;border:none;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:all .2s}
.fab-r{background:#fff;color:var(--red);border:1.5px solid #fee2e2}
.fab-r:hover{background:#fee2e2;transform:translateY(-1px)}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:46px;margin-bottom:10px}
.empty-t{font-size:15px;font-weight:500;margin-bottom:5px}
.empty-s{font-size:13px}

/* BOOKING */
.bk-btn{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;padding:4px 10px;border-radius:20px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s}
.bk-btn:hover{border-color:var(--sky);color:var(--sky)}
.bk-btn.set{border-style:solid;border-color:var(--green);background:var(--green-l);color:#166534;font-weight:500}
.bk-note-txt{font-size:11px;color:var(--muted);margin-top:2px;padding-left:2px}
.bk-list{padding:0 12px 4px}
.bk-item{background:#fff;border-radius:10px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--sh);display:flex;align-items:flex-start;gap:10px}
.bk-dot{width:8px;height:8px;border-radius:50%;background:var(--sky);flex-shrink:0;margin-top:5px}
.bk-info{flex:1;min-width:0}
.bk-time-txt{font-size:13px;font-weight:600;color:var(--sky-d)}
.bk-step-nm{font-size:12px;color:var(--text);margin-top:2px}
.bk-proc-nm{font-size:11px;color:var(--muted);margin-top:1px}
.bk-clr{font-size:18px;color:var(--muted);cursor:pointer;padding:0 2px;background:none;border:none;flex-shrink:0;line-height:1}
.bk-clr:hover{color:var(--red)}
.no-bk{font-size:13px;color:var(--muted);text-align:center;padding:8px 0 4px}

/* FAIL */
.step.fail{background:#fff5f5}
.chk.fail{background:var(--red);border-color:var(--red);color:#fff}
.fail-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#b91c1c;background:#fee2e2;border-radius:4px;padding:2px 8px;margin-top:4px}
.fail-btn{display:inline-flex;align-items:center;gap:3px;margin-top:6px;margin-left:4px;font-size:12px;padding:4px 10px;border-radius:20px;border:1.5px solid #fca5a5;background:transparent;color:#dc2626;cursor:pointer;transition:all .2s}
.fail-btn:hover,.fail-btn.set{background:#fee2e2}
.step-btns{display:flex;flex-wrap:wrap;gap:0}
/* EXPORT FAB */
.fab-g{background:#fff;color:#059669;border:1.5px solid #a7f3d0}
.fab-g:hover{background:#ecfdf5;transform:translateY(-1px)}
/* TIMER */
.tbar{position:fixed;top:0;left:0;right:0;z-index:300;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;padding:10px 16px;display:none;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.2);max-width:640px;margin:0 auto}
.tbar.on{display:flex}
.tbar-info{flex:1}
.tbar-nm{font-size:11px;opacity:.8;margin-bottom:2px}
.tbar-cnt{font-size:24px;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.tbar-cnt.done{color:#fde68a;animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.tbar-stop{background:rgba(255,255,255,.22);border:none;color:#fff;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.tbtn{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:4px 10px;border-radius:20px;border:1.5px solid #bae6fd;background:transparent;color:#0284c7;cursor:pointer;transition:all .2s}
.tbtn:hover{background:#e0f2fe}
.tbtn.on{background:#0ea5e9;border-color:#0ea5e9;color:#fff;font-weight:600}
/* PARAMS */
.pbtn{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:4px 10px;border-radius:20px;border:1.5px solid #bbf7d0;background:transparent;color:#059669;cursor:pointer;transition:all .2s}
.pbtn:hover{background:#ecfdf5}
.pbtn.set{background:#ecfdf5;border-color:#34d399;font-weight:500}
.psum{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}
.pthumbs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pthumb{width:54px;height:54px;border-radius:7px;object-fit:cover;cursor:pointer;border:1.5px solid var(--border)}
/* PHOTO VIEWER */
.pvwr{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:400;display:none;align-items:center;justify-content:center}
.pvwr.on{display:flex}
.pvwr img{max-width:96vw;max-height:88vh;border-radius:8px;object-fit:contain}
.pvwr-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.18);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
/* BATCH */
.batch-bar{background:#fff;padding:9px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:12px}
.batch-info{color:var(--muted)}
.batch-info b{color:var(--text)}
.batch-link{color:var(--sky);font-weight:600;cursor:pointer;border:none;background:none;font-size:12px;padding:0}
.batch-item{background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.batch-item-hdr{font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between}
.batch-item-sub{font-size:12px;color:var(--muted)}
.fab-b{background:#fff;color:#7c3aed;border:1.5px solid #ddd6fe}
.fab-b:hover{background:#f5f3ff;transform:translateY(-1px)}

@media(min-width:641px){.modal{border-radius:20px;max-height:80vh;margin-bottom:20px}.overlay{align-items:center}}
/* PRINT */
#pov{display:none}
@media print{
  body>*:not(#pov){display:none!important}
  #pov{display:block!important;padding:0;background:white}
  .pov-step{page-break-inside:avoid}
  .pov-phase{page-break-inside:avoid}
}
</style>
</head>
<body>
<div id="pov"></div>
<!-- Timer banner -->
<div class="tbar" id="tbar">
  <div class="tbar-info">
    <div class="tbar-nm" id="tbarNm"></div>
    <div class="tbar-cnt" id="tbarCnt">00:00</div>
  </div>
  <button class="tbar-stop" onclick="stopTimer()">■ 停止</button>
</div>
<!-- Photo capture input (hidden) -->
<input type="file" accept="image/*" capture="environment" id="photoCapture" style="display:none" onchange="handlePhoto(event)">
<!-- Photo viewer -->
<div class="pvwr" id="pvwr" onclick="closePvwr()">
  <img id="pvwrImg" src="">
  <button class="pvwr-close" onclick="closePvwr()">×</button>
</div>

<div class="wrap">
  <div class="ebanner" id="ebanner">
    <span id="ebtxt">✏️ 编辑模式 — 点击步骤旁的按钮修改内容</span>
    <button class="ebanner-btn" onclick="exitEdit()" id="doneBtn">完成</button>
  </div>
  <div class="hdr">
    <div class="hdr-l">
      <button class="back" id="backBtn" onclick="goHome()">←</button>
      <div>
        <div class="htitle" id="htitle">微纳工艺助手</div>
        <div class="hsub" id="hsub">实验室工艺流程管理</div>
      </div>
    </div>
    <div class="hdr-r">
      <button class="lbtn" onclick="toggleLang()" id="lbtn">EN</button>
      <button class="ibtn" id="editBtn" onclick="toggleEdit()" title="编辑">✏️</button>
    </div>
  </div>
  <div id="homeView"></div>
  <div id="procView" style="display:none"></div>
</div>

<div class="fab-wrap" id="fab">
  <button class="fab fab-r" onclick="resetProg()"><span>↺</span><span id="rstTxt">重置进度</span></button>
  <button class="fab fab-b" onclick="openNewBatchModal()">📦 <span id="batchTxt">新建批次</span></button>
  <button class="fab fab-g" onclick="exportSingleBatch(-1)">📄 当前批次</button>
  <button class="fab fab-g" onclick="exportRecord()" style="opacity:.8">📋 全部批次</button>
</div>

<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal" id="modal">
    <div class="mhandle"></div>
    <div class="mtitle" id="mtitle">编辑步骤</div>
    <div id="mbody"></div>
    <div class="mact">
      <button class="mcancel" onclick="closeModal()" id="mcancel">取消</button>
      <button class="msave" onclick="doSave()" id="msave">保存</button>
    </div>
  </div>
</div>

<script>
// ── DEFAULT DATA ──────────────────────────────────────────────
const DEF = [
{
  id:"p1", icon:"🔬",
  name:{zh:"三层无磁加热片",en:"3-Layer Non-Magnetic Heater"},
  description:{zh:"硼硅玻璃基底 · 三层 Ag 金属结构 · SiO₂ 绝缘与保护",en:"Borosilicate glass · Three Ag layers · SiO₂ insulation & passivation"},
  phases:[
    { id:"ph1", color:"#64748b",
      name:{zh:"基底准备",en:"Substrate Prep"},
      steps:[
        { id:"s1_1", name:{zh:"基底清洗",en:"Substrate Cleaning"}, time:{zh:"约 20 min",en:"~20 min"},
          equipment:{zh:"超声清洗机",en:"Ultrasonic cleaner"},
          notes:[
            {zh:"丙酮超声清洗 5 min，去除有机污染物",en:"Ultrasonic in acetone 5 min, remove organics"},
            {zh:"异丙醇 (IPA) 超声清洗 5 min",en:"Ultrasonic in IPA 5 min"},
            {zh:"去离子水冲洗 ×3",en:"Rinse with DI water ×3"},
            {zh:"氮气枪吹干",en:"Blow dry with N₂ gun"},
            {zh:"⚠ 全程戴手套，防止皮肤油脂污染基底",en:"⚠ Wear gloves throughout; prevent skin oil contamination"}
          ]},
        { id:"s1_2", name:{zh:"烘干脱水处理",en:"Dehydration Bake"}, time:{zh:"约 10 min",en:"~10 min"},
          equipment:{zh:"热板 120°C",en:"Hotplate 120°C"},
          notes:[
            {zh:"热板 120°C 烘烤 10 min",en:"Bake at 120°C for 10 min"},
            {zh:"去除表面残余水汽，提高膜层附着力",en:"Remove residual moisture; improve film adhesion"},
            {zh:"⚠ 冷却至室温后再进行下一步",en:"⚠ Cool to room temperature before proceeding"}
          ]}
      ]},
    { id:"ph2", color:"#3b82f6",
      name:{zh:"第一金属层 M1 · Ag 400 nm",en:"Metal Layer 1 (M1 · Ag 400 nm)"},
      steps:[
        { id:"s2_1", name:{zh:"PECVD 沉积 SiO₂ 缓冲层 (400 nm)",en:"PECVD Deposit SiO₂ Buffer (400 nm)"}, time:{zh:"约 30 min",en:"~30 min"},
          equipment:{zh:"PECVD 系统",en:"PECVD system"},
          notes:[
            {zh:"硼硅玻璃难以直接刻蚀，先沉积 SiO₂ 作为图形转移介质",en:"Borosilicate glass hard to etch directly; SiO₂ acts as pattern-transfer medium"},
            {zh:"典型气体：SiH₄ + N₂O 或 TEOS + O₂，温度 200–300°C",en:"Typical gases: SiH₄+N₂O or TEOS+O₂; temp 200–300°C"},
            {zh:"⚠ 沉积前检查腔室洁净度和气体流量参数",en:"⚠ Check chamber cleanliness and gas flow before deposition"}

let db = { processes: JSON.parse(JSON.stringify(DEF)), progress: {}, bookings: {}, failures: {}, params: {}, batches: {} };
let _idb = null;

function _idbOpen() {
  return new Promise(res => {
    const r = indexedDB.open('mfdb2', 1);
    r.onupgradeneeded = e => e.target.result.createObjectStore('kv');
    r.onsuccess = e => { _idb = e.target.result; res(); };
    r.onerror = () => res();
  });
}

function save() {
  if (_idb) {
    _idb.transaction('kv','readwrite').objectStore('kv').put(db,'db');
  }
  // localStorage 备份（去掉照片，只保留文字记录，防止 IDB 不可用时丢失文字）
  try {
    const slim = JSON.parse(JSON.stringify(db));
    Object.values(slim.params||{}).forEach(steps =>
      Object.values(steps).forEach(d => { if(d) delete d.photos; }));
    Object.values(slim.batches||{}).forEach(arr =>
      arr.forEach(b => Object.values(b.params||{}).forEach(d => { if(d) delete d.photos; })));
    localStorage.setItem('mf_db', JSON.stringify(slim));
  } catch(e) {}
}
function prog(pid) { return db.progress[pid] || {}; }
function totalSteps(p) { return p.phases.reduce((s,ph)=>s+ph.steps.length,0); }
function doneSteps(pid,p) { const g=prog(pid); return p.phases.reduce((s,ph)=>s+ph.steps.filter(st=>g[st.id]).length,0); }
function txt(o) { if (!o) return ''; if (typeof o==='string') return o; return o[lang]||o.zh||''; }

function timeTotal(p) {
  let t=0;
  p.phases.forEach(ph=>ph.steps.forEach(s=>{
    const str=s.time?.zh||'';
    const m1=str.match(/(\d+)[^\d]+(\d+)/);
    if(m1) t+=(+m1[1]+ +m1[2])/2;
    else { const m2=str.match(/(\d+)/); if(m2) t+= +m2[1]; }
  }));
  const h=Math.floor(t/60), m=Math.round(t%60);
  return lang==='zh'
    ? (h>0?`约 ${h} h ${m?m+'min':''}`:`约 ${t} min`)
    : (h>0?`~${h}h ${m?m+'min':''}`:`~${t} min`);
}

function formatDt(dtStr) {
  if (!dtStr) return '';
  const d = new Date(dtStr);
  const pad = n => String(n).padStart(2,'0');
  if (lang === 'zh')
    return `${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function getUpcoming() {
  const now = Date.now();
  const items = [];
  Object.entries(db.bookings||{}).forEach(([sid, bk]) => {
    if (!bk.dt) return;
    const dt = new Date(bk.dt).getTime();
    // find step info
    let stepName='', procName='', procId='';
    db.processes.forEach(p => p.phases.forEach(ph => ph.steps.forEach(s => {
      if (s.id === sid) { stepName=txt(s.name); procName=txt(p.name); procId=p.id; }
    })));
    items.push({ sid, dt, dtStr:bk.dt, note:bk.note||'', stepName, procName, procId });
  });
  return items.sort((a,b)=>a.dt-b.dt);
}

function toggleStep(sid) {
  if (editMode) return;
  const g = prog(curPid);
  g[sid] = !g[sid];
  db.progress[curPid] = g;
  // 标记为完成时清除失败标记
  if (g[sid] && db.failures?.[curPid]?.[sid]) delete db.failures[curPid][sid];
  save(); render();
}
function togglePhase(pid) {
  const p = db.processes.find(x=>x.id===curPid);
  const ph = p?.phases.find(x=>x.id===pid);
  if (ph) { ph.collapsed=!ph.collapsed; save(); render(); }
}
function toggleNotes(sid) {
  let st=null;
  db.processes.forEach(p=>p.phases.forEach(ph=>ph.steps.forEach(s=>{if(s.id===sid)st=s;})));
  if(st){st._no=!st._no;render();}
}
function resetProg() {
  if(confirm(t('rstQ'))){
    db.progress[curPid]={};
    if(db.failures) db.failures[curPid]={};
    if(db.params) db.params[curPid]={};
    save();render();
  }
}

function openBookingModal(sid) {
  if (!db.bookings) db.bookings = {};
  const bk = db.bookings[sid] || {};
  // default to tomorrow 9:00
  const defDt = (() => {
    const d = new Date(); d.setDate(d.getDate()+1); d.setHours(9,0,0,0);
    return d.toISOString().slice(0,16);
  })();
  const body = `
    <div class="fg">
      <label class="flabel">${t('bkDt')}</label>
      <input class="fi" type="datetime-local" id="bk_dt" value="${bk.dt||defDt}">
    </div>
    <div class="fg">
      <label class="flabel">${t('bkNote')}</label>
      <input class="fi" id="bk_note" placeholder="${t('bkNotePlh')}" value="${bk.note||''}">
    </div>
    ${bk.dt?`<button onclick="clearBooking('${sid}');closeModal()" style="width:100%;padding:10px;border-radius:8px;border:none;background:#fee2e2;color:#b91c1c;font-size:13px;cursor:pointer;margin-bottom:4px">${t('bkClear')}</button>`:''}
  `;
  openModal(t('bkModal'), body, () => {
    const dt = document.getElementById('bk_dt').value;
    if (!dt) return;

function clearBooking(sid) {
  if (!db.bookings) return;

// ── FAILURE ──────────────────────────────────────────────────
function openFailModal(sid) {
  if (!db.failures) db.failures = {};
  if (!db.failures[curPid]) db.failures[curPid] = {};
  const existing = db.failures[curPid][sid];
  const body = `
    <div class="fg">
      <label class="flabel">${t('failReason')}</label>
      <input class="fi" id="fail_r" placeholder="${t('failReasonPlh')}" value="${existing?.reason||''}">
    </div>
    ${existing ? `<button onclick="clearFailed('${sid}');closeModal()" style="width:100%;padding:10px;border-radius:8px;border:none;background:#fee2e2;color:#b91c1c;font-size:13px;cursor:pointer;margin-bottom:4px">${t('failClear')}</button>` : ''}
  `;
  openModal(t('failModal'), body, () => {
    // 标记失败时清除完成状态
    if (db.progress[curPid]) db.progress[curPid][sid] = false;
    db.failures[curPid][sid] = { reason: document.getElementById('fail_r').value.trim(), ts: Date.now() };
    save(); closeModal(); render();
  });
}

function clearFailed(sid) {
  if (db.failures?.[curPid]?.[sid]) delete db.failures[curPid][sid];
  save(); render();

// ── TIMER ────────────────────────────────────────────────────
let timer = { sid: null, rem: 0, itvl: null, name: '' };

function isTimerFor(sid) { return timer.sid === sid; }

function fmtTime(sec) {
  const m = Math.floor(sec/60), s = sec % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function parseStepTime(str) {
  const s = str || '';
  const secR = s.match(/(\d+)\s*[–\-~]\s*(\d+)\s*s/i) || s.match(/(\d+)\s*s(?!ec)/i);
  if (secR) return secR[2] ? parseInt(secR[2]) : parseInt(secR[1]);
  const minR = s.match(/(\d+)\s*[–\-~]\s*(\d+)\s*min/i) || s.match(/(\d+)\s*min/i);
  if (minR) return parseInt(minR[1]) * 60;
  return 5 * 60;
}

function openTimerModal(sid, stepName, timeStr) {
  const def = parseStepTime(timeStr);
  const dm = Math.floor(def/60), ds = def % 60;
  openModal(t('timerSet'), `
    <div style="font-size:13px;color:var(--muted);text-align:center;margin-bottom:14px">${stepName}</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:10px">
      <div style="text-align:center">
        <input class="fi" type="number" id="tm_m" value="${dm}" min="0" max="99" style="width:72px;text-align:center;font-size:22px;font-weight:700">
        <div style="font-size:11px;color:var(--muted);margin-top:4px">分钟</div>
      </div>
      <div style="font-size:26px;font-weight:700;padding-bottom:20px">:</div>
      <div style="text-align:center">
        <input class="fi" type="number" id="tm_s" value="${ds}" min="0" max="59" style="width:72px;text-align:center;font-size:22px;font-weight:700">
        <div style="font-size:11px;color:var(--muted);margin-top:4px">秒</div>
      </div>
    </div>
  `, () => {
    const total = (parseInt(document.getElementById('tm_m').value)||0)*60 + (parseInt(document.getElementById('tm_s').value)||0);
    if (total <= 0) return;
    startTimer(sid, stepName, total);
    closeModal();
  });
  document.getElementById('msave').textContent = t('timerStart');
}

function startTimer(sid, name, seconds) {
  if (timer.itvl) clearInterval(timer.itvl);
  timer = { sid, name, rem: seconds, itvl: null };
  const bar = document.getElementById('tbar');
  bar.classList.add('on');
  document.getElementById('tbarNm').textContent = name;
  document.getElementById('tbarCnt').textContent = fmtTime(seconds);
  document.getElementById('tbarCnt').classList.remove('done');
  document.querySelector('.wrap').style.paddingTop = '60px';
  render();
  timer.itvl = setInterval(() => {
    timer.rem--;
    const cnt = document.getElementById('tbarCnt');
    if (cnt) cnt.textContent = fmtTime(Math.max(0, timer.rem));
    // update just the button text, no full render
    const btn = document.querySelector(`[data-tsid="${timer.sid}"]`);
    if (btn) btn.textContent = '⏱ ' + fmtTime(Math.max(0, timer.rem));
    if (timer.rem <= 0) {
      clearInterval(timer.itvl); timer.itvl = null;
      if (cnt) cnt.classList.add('done');
      if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 600]);
      render();
    }
  }, 1000);
}

function stopTimer() {
  if (timer.itvl) clearInterval(timer.itvl);
  timer = { sid: null, rem: 0, itvl: null, name: '' };
  document.getElementById('tbar').classList.remove('on');
  document.getElementById('tbarCnt').classList.remove('done');
  document.querySelector('.wrap').style.paddingTop = '';
  render();
}

    let h = `<div class="pov-step" style="background:${bg};border-radius:10px;padding:13px 15px;margin-bottom:8px;border:1px solid ${done?'#bbf7d0':fail?'#fecaca':'#e2e8f0'}">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="width:26px;height:26px;border-radius:7px;background:${ic};color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;margin-top:1px">${icon}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:600;color:${ic}">${idx+1}. ${txt(s.name)}</div>
          <div style="font-size:12px;color:#64748b;margin-top:3px">⏱ ${txt(s.time)}${txt(s.equipment)?'　📍 '+txt(s.equipment):''}</div>
        </div>
      </div>`;
    if (fail && fs2[s.id]?.reason)
      h += `<div style="margin-top:8px;background:#fee2e2;border-radius:7px;padding:8px 12px;font-size:12px;color:#b91c1c">✗ 失败原因：${fs2[s.id].reason}</div>`;
    if (bk?.dt)
      h += `<div style="margin-top:6px;font-size:12px;color:#0284c7">📅 预约：${formatDt(bk.dt)}${bk.note?' · '+bk.note:''}</div>`;
    if (pr.text)
      h += `<div style="margin-top:8px;background:#ecfdf5;border-radius:7px;padding:8px 12px;font-size:12px;color:#166534">📝 ${pr.text}</div>`;
    if (pr.photos?.length) {
      h += `<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:10px">`;
      pr.photos.forEach(src => { h += `<img src="${src}" style="width:130px;height:130px;object-fit:cover;border-radius:8px;border:1px solid #e2e8f0">`; });
      h += `</div>`;
    }
    if (s.notes?.length) {
      h += `<div style="margin-top:10px;background:#f8fafc;border-radius:7px;padding:10px 12px">
        <div style="font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:.06em;margin-bottom:6px">注意事项</div>`;
      s.notes.forEach(n => {
        const tx=txt(n), isW=tx.startsWith('⚠'), clean=tx.replace(/^⚠\s*/,'');
        h += `<div style="font-size:12px;color:${isW?'#92400e':'#334155'};padding:2px 0 2px 16px;position:relative;${isW?'background:#fef3c7;border-radius:4px;padding:4px 8px 4px 22px;margin:3px 0':''}">
          <span style="position:absolute;left:${isW?6:2}px;color:${isW?'#f97316':'#0ea5e9'}">${isW?'⚠':'·'}</span>${clean}</div>`;
      });
      h += `</div>`;
    }
    h += `</div>`;
    return h;
  }

  function sectionHtml(g2, fs2, ps2, label, labelColor) {
    let h = `<div style="margin-bottom:28px">
      <div style="background:${labelColor};color:white;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;margin-bottom:12px">${label}</div>`;
    p.phases.forEach(ph => {
      const phDn = ph.steps.filter(s=>!!g2[s.id]).length;
      h += `<div class="pov-phase" style="margin-bottom:14px">
        <div style="background:${ph.color};color:white;padding:8px 13px;border-radius:8px 8px 0 0;font-size:13px;font-weight:700;display:flex;justify-content:space-between">
          <span>${txt(ph.name)}</span><span style="opacity:.75">${phDn}/${ph.steps.length}</span>
        </div>
        <div style="border:1px solid ${ph.color}33;border-top:none;border-radius:0 0 8px 8px;padding:10px 10px 2px">`;
      ph.steps.forEach((s,i) => { h += stepBlock(s,i,g2,fs2,ps2); });
      h += `</div></div>`;
    });
    h += `</div>`;
    return h;
  }

  // Summary badges
  let summary = `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
    <span style="background:#e0f2fe;color:#0284c7;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600">${tot} 步</span>
    <span style="background:#dcfce7;color:#166534;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600">✓ ${dn} 完成</span>
    ${fc?`<span style="background:#fee2e2;color:#b91c1c;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600">✗ ${fc} 失败</span>`:''}
    ${batches.length?`<span style="background:#ede9fe;color:#7c3aed;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600">📦 ${batches.length+1} 批次</span>`:''}
  </div>`;

  let html = `<div style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;max-width:800px;margin:0 auto;padding:20px;color:#0f172a">
    <div style="text-align:center;padding-bottom:18px;margin-bottom:24px;border-bottom:2px solid #0ea5e9">
      <div style="font-size:22px;font-weight:800;color:#0284c7">${txt(p.name)}</div>
      <div style="font-size:13px;color:#64748b;margin-top:5px">${txt(p.description)}</div>
      <div style="font-size:11px;color:#94a3b8;margin-top:4px">导出时间：${dateStr}</div>
      ${summary}
    </div>
    ${sectionHtml(g, fails, params, '当前批次', '#0ea5e9')}`;

  if (batches.length) {
    [...batches].reverse().forEach((b,i) => {
      const d = new Date(b.ts);
      const ds = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      const bdn = Object.values(b.progress||{}).filter(Boolean).length;
      const bfc = Object.keys(b.failures||{}).length;
      html += sectionHtml(b.progress||{}, b.failures||{}, b.params||{},
        `历史批次 ${batches.length-i}：${b.name}　${ds}　${bdn}/${tot} 完成${bfc?' · '+bfc+' 失败':''}${b.notes?' · '+b.notes:''}`, '#64748b');
    });
  }
  html += `</div>`;

  document.getElementById('pov').innerHTML = html;
  setTimeout(() => window.print(), 200);
}

// ── EXPORT TXT (保留备用) ─────────────────────────────────────
function generateReport() {
  const p = db.processes.find(x=>x.id===curPid);
  if (!p) return '';
  const pad = n=>String(n).padStart(2,'0');
  const now = new Date();
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const tot = totalSteps(p);
  const batches = (db.batches||{})[curPid]||[];
  const sep  = '================================================================';
  const sep2 = '────────────────────────────────────────────────────────────────';

  function renderBatch(progress, failures, params, label) {
    const g = progress||{}, fs = failures||{}, ps = params||{};
    const dn = Object.values(g).filter(Boolean).length;
    const fc = Object.keys(fs).length;
    let lines = [`\n${sep}`, `  ${label}`, `  进度：${dn}/${tot} 步完成${fc?'，'+fc+' 步失败':''}`, sep];
    p.phases.forEach(ph => {
      lines.push(`\n◆ ${txt(ph.name)}`);
      ph.steps.forEach((s,i) => {
        const done = !!g[s.id], fail = fs[s.id];
        const pr = ps[s.id]||{}, bk = (db.bookings||{})[s.id];
        const icon = done?'✓':fail?'✗':'○';
        lines.push(`${sep2}`);
        lines.push(`${icon} 步骤 ${i+1}：${txt(s.name)}`);
        lines.push(`  预计时间：${txt(s.time)}`);
        if (txt(s.equipment)) lines.push(`  设备：${txt(s.equipment)}`);
        if (fail) lines.push(`  【失败原因】${fail.reason||'（未填写）'}`);
        if (bk?.dt) lines.push(`  【预约时间】${formatDt(bk.dt)}${bk.note?' · '+bk.note:''}`);
        if (pr.text) lines.push(`  【实际参数】${pr.text}`);
        if (pr.photos?.length) lines.push(`  【照片记录】${pr.photos.length} 张`);
        if (s.notes?.length) {
          lines.push('  【注意事项】');
          s.notes.forEach(n => {
            const tx = txt(n);
            lines.push('    ' + (tx.startsWith('⚠')?tx:'· '+tx));
          });
        }
      });
    });
    return lines.join('\n');
  }

  let out = [
    sep,
    '  微纳工艺助手 · 完整工艺记录',
    sep,
    `工艺名称：${txt(p.name)}`,
    `描  述：${txt(p.description)}`,
    `导出时间：${dateStr}`,
    `历史批次：${batches.length} 批`,
    '',
  ].join('\n');

  out += renderBatch(db.progress[curPid], (db.failures||{})[curPid], (db.params||{})[curPid], '当前批次');

  if (batches.length) {
    const sorted = [...batches].reverse();
    sorted.forEach((b,i) => {
      out += renderBatch(b.progress, b.failures, b.params, `历史批次 ${batches.length-i}：${b.name}${b.notes?' · '+b.notes:''}`);
    });
  }
  out += `\n${sep}\n`;
  return out;
}

// ── EDIT MODE ────────────────────────────────────────────────
function toggleEdit() { editMode=!editMode; render(); }
function exitEdit() { editMode=false; render(); }

function delStep(phid,sid) {
  if(!confirm(t('delSQ')))return;
  const p=db.processes.find(x=>x.id===curPid);
  const ph=p?.phases.find(x=>x.id===phid);
  if(ph){ph.steps=ph.steps.filter(s=>s.id!==sid);save();render();}
}

// ── MODAL ────────────────────────────────────────────────────
const COLORS=['#64748b','#3b82f6','#f97316','#8b5cf6','#06b6d4','#22c55e','#ef4444','#f59e0b'];

function openModal(title,body,onSave) {
  document.getElementById('mtitle').textContent=title;
  document.getElementById('mbody').innerHTML=body;
  document.getElementById('msave').textContent=t('sv');
  document.getElementById('mcancel').textContent=t('cancel');
  document.getElementById('overlay').classList.add('on');
  _save=onSave;
}
function closeModal() { document.getElementById('overlay').classList.remove('on'); _save=null; }
function overlayClick(e) { if(e.target===document.getElementById('overlay'))closeModal(); }
function doSave() { if(_save)_save(); }
function n2arr(tx) { return tx.split('\n').map(l=>l.trim()).filter(l=>l).map(l=>({zh:l,en:l})); }
function arr2n(arr) { return (arr||[]).map(n=>n.zh||n).join('\n'); }
function findStep(sid) {
  let r=null;
  db.processes.forEach(p=>p.phases.forEach(ph=>ph.steps.forEach(s=>{if(s.id===sid)r=s;})));
  return r;
}

function colorPicker(sel) {
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">
    ${COLORS.map(c=>`<span onclick="document.getElementById('fc').value='${c}';this.parentNode.querySelectorAll('span').forEach(x=>x.style.outline='none');this.style.outline='3px solid #0ea5e9'" style="width:28px;height:28px;border-radius:50%;background:${c};cursor:pointer;outline:${c===sel?'3px solid #0ea5e9':'none'}"></span>`).join('')}
  </div><input type="hidden" id="fc" value="${sel}">`;
}

function openEditStepModal(sid) {
  const s=findStep(sid);if(!s)return;
  openModal(t('editS'),`
    <div class="fg"><label class="flabel">${t('fName')}</label><input class="fi" id="fn" value="${txt(s.name)}"></div>
    <div class="fg"><label class="flabel">${t('fTime')}</label><input class="fi" id="ft" value="${txt(s.time)}"></div>
    <div class="fg"><label class="flabel">${t('fEquip')}</label><input class="fi" id="fe" value="${txt(s.equipment||'')}"></div>
    <div class="fg"><label class="flabel">${t('fNotes')}</label><textarea class="fta" id="fno" rows="6">${arr2n(s.notes)}</textarea><div class="fhint">每行一条，⚠ 开头显示为橙色警告</div></div>
  `, ()=>{
    const name=document.getElementById('fn').value.trim();if(!name)return;
    s.name={zh:name,en:name};
    s.time={zh:document.getElementById('ft').value.trim(),en:document.getElementById('ft').value.trim()};

function openAddStepModal(phid) {
  openModal(t('addS'),`

    <div class="fg"><label class="flabel">${t('fNotes')}</label><textarea class="fta" id="fno" rows="4" placeholder="每行一条，⚠ 开头为警告"></textarea></div>

    });

// ── INIT ─────────────────────────────────────────────────────
(async () => {
  await _idbOpen();
  const loadLS = () => {
    try {
      const s = localStorage.getItem('mf_db');
      if (!s) return false;
      const p = JSON.parse(s);
      if (!p?.processes?.length) return false;
      if (!p.bookings) p.bookings = {};
      if (!p.failures) p.failures = {};
      if (!p.params) p.params = {};
      if (!p.batches) p.batches = {};
      db = p;
      return true;
    } catch(e) { return false; }
  };
  if (_idb) {
    const saved = await new Promise(res => {
      const r = _idb.transaction('kv').objectStore('kv').get('db');
      r.onsuccess = e => res(e.target.result ?? null);
      r.onerror = () => res(null);
    });
    if (saved?.processes?.length) {
      db = saved;
      if (!db.bookings) db.bookings = {};
      if (!db.failures) db.failures = {};
      if (!db.params) db.params = {};
      if (!db.batches) db.batches = {};
    } else if (loadLS()) {
      save(); // 迁移旧数据到 IndexedDB
    }
  } else {
    loadLS();
  }
  render();
})();
</script>
